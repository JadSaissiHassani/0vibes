<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Devlog — 0vibe</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, Segoe UI, Roboto, sans-serif;
            background: #0f0f14;
            color: #f2f2f5;
        }
        .content {
            max-width: 700px;
            margin: 0 auto;
            padding: 2rem;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
        }
        .entry {
            background: #1a1a22;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .entry h2 {
            margin: 0 0 0.25rem 0;
            font-size: 1.2rem;
        }
        .entry .date {
            color: #9a9aa5;
            font-size: 0.8rem;
            margin-bottom: 0.75rem;
        }
        .entry p {
            line-height: 1.6;
            white-space: pre-line;
        }
        .empty {
            color: #9a9aa5;
        }
    </style>
</head>
<body>
    {% include 'store/nav.html' %}
    <div class="content">
        <h1>Devlog</h1>
        {% for entry in entries %}
            <div class="entry">
                <h2>{{ entry.title }}</h2>
                <div class="date">{{ entry.created_at|date:"F j, Y" }}</div>
                <p>{{ entry.content }}</p>
            </div>
        {% empty %}
            <p class="empty">No devlog entries yet — check back soon.</p>
        {% endfor %}
    </div>
</body>
</html>
