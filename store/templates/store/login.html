{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log In — 0vibe</title>
    <link rel="stylesheet" href="{% static 'store/main.css' %}">
    <style>
        .wrap { display: flex; align-items: center; justify-content: center; height: calc(100vh - 65px); }
        .card { width: 320px; }
        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; text-align: center; }
        p { text-align: center; color: var(--text-muted); font-size: 0.9rem; }
    </style>
</head>
<body>
    {% include 'store/nav.html' %}
    <div class="wrap">
        <div class="card">
            <h1>Welcome back</h1>
            {% if messages %}
                {% for message in messages %}
                    <div class="error">{{ message }}</div>
                {% endfor %}
            {% endif %}
            <form method="POST">
                {% csrf_token %}
                <input type="email" name="email" placeholder="Email address" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit" style="width: 100%;">Log In</button>
            </form>
            <p>Don't have an account? <a href="{% url 'signup' %}">Sign up</a></p>
        </div>
    </div>
</body>
</html>
