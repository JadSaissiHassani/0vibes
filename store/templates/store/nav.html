{% load static %}
<style>
    nav {
        display: flex;
        align-items: center;
        gap: 2rem;
        padding: 1.1rem 2.5rem;
        background: rgba(26, 26, 34, 0.7);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid #26262f;
        position: sticky;
        top: 0;
        z-index: 100;
        border-radius: 12px 12px 12px;
    }
    nav .logo {
    font-weight: 800;
    font-size: 1.15rem;
    letter-spacing: -0.02em;
    color: #f2f2f5;
    text-decoration: none;
    margin-right: auto;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    text-shadow: 0 0 12px #4A0404;
}
    nav .logo::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4A0404;
    box-shadow: 0 0 12px #813e3e;
}
    nav .links {
        display: flex;
        gap: 1.75rem;
    }
    nav .links a {
        position: relative;
        color: #9a9aa5;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
        padding: 0.25rem 0;
        transition: color 0.15s ease;
    }
    nav .links a::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -2px;
        width: 0%;
        height: 2px;
        background: #4A0404;
        transition: width 0.2s ease;
    }
    nav .links a:hover {
        color: #f2f2f5;
    }
    nav .links a:hover::after {
        width: 100%;
    }
    nav .actions {
        display: flex;
        align-items: center;
        gap: 1rem;
    }
    nav .actions a {
        color: #9a9aa5;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
    }
    nav .actions a:hover {
        color: #f2f2f5;
    }
    nav .actions .cta {
        background: #4A0404;
        color: white !important;
        padding: 0.5rem 1.1rem;
        border-radius: 8px;
        font-weight: 600;
    }
    nav .actions .cta:hover {
        background: #4A0404;
        color: white !important;
    }
</style>
<nav>
    <a href="{% url 'homepage' %}" class="logo">
    <img src="{% static 'store/logo.png' %}" alt="0vibes" style="height: 40px; width: 40px; object-fit: cover; border-radius: 10px;">
    <span class="logo-text">0vibes</span>
</a>
    <div class="links">
    <a href="{% url 'products' %}">Products</a>
    <a href="{% url 'contact' %}">Contact</a>
    <a href="{% url 'policies' %}">Policies</a>
    {% if request.user.is_authenticated %}
        <a href="{% url 'dashboard' %}">Dashboard</a>
    {% endif %}
</div>
    <div class="actions">
        {% if request.user.is_authenticated %}
            <a href="{% url 'logout' %}" onclick="return confirm('Are you sure you want to log out?');">Log out</a>
        {% else %}
            <a href="{% url 'login' %}">Log in</a>
            <a href="{% url 'signup' %}" class="cta">Sign up</a>
        {% endif %}
    </div>
</nav>
