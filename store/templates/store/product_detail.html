{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ product.name }} — 0vibe</title>
    <link rel="stylesheet" href="{% static 'store/main.css' %}">
    <style>
        .content { padding: 2rem; }
        .layout { display: flex; gap: 2.5rem; margin-top: 1.5rem; flex-wrap: wrap; }
        .image-box {
            width: 320px;
            height: 320px;
            background: var(--surface);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .image-box img { width: 100%; height: 100%; object-fit: cover; }
        .placeholder { color: var(--text-muted); }
        .info h1 { margin: 0 0 0.5rem 0; }
        .info .category { color: var(--text-muted); margin-bottom: 1rem; }
        .price { font-size: 1.4rem; color: var(--accent); font-weight: 700; margin-bottom: 1.5rem; }
        .description { color: var(--text-muted); max-width: 400px; line-height: 1.5; margin-bottom: 2rem; }

        .variants { margin-bottom: 1.5rem; }
        .variant-group { margin-bottom: 1rem; }
        .variant-group label {
            display: block;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .variant-options { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .variant-btn {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            font-size: 0.9rem;
        }
        .variant-btn.selected {
            border-color: var(--accent);
            background: var(--accent);
            color: #2b0a0c;
        }
        .variant-btn.out-of-stock {
            opacity: 0.4;
            cursor: not-allowed;
            text-decoration: line-through;
        }
        .stock-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .stock-dot.in { background: #4ade80; }
        .stock-dot.out { background: #f87171; }
        .stock-label { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem; }
    </style>
</head>
<body>
    {% include 'store/nav.html' %}
    <div class="content">
        <a href="{% url 'products' %}">&larr; Back to products</a>
        <div class="layout">
            <div class="image-box">
                {% if product.image %}
                    <img src="{{ product.image.url }}" alt="{{ product.name }}">
                {% else %}
                    <span class="placeholder">No image</span>
                {% endif %}
            </div>
            <div class="info">
                <h1>{{ product.name }}</h1>
                <div class="category">{{ product.category }}</div>
                <div class="price">${{ product.base_price }}</div>
                <div class="description">{{ product.description }}</div>

                <div class="variants">
                    <div class="variant-group">
