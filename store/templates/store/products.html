<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Products — 0vibe</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, Segoe UI, Roboto, sans-serif;
            background: #0f0f14;
            color: #f2f2f5;
            padding: 2rem;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }
        .card {
            background: #1a1a22;
            border-radius: 12px;
            padding: 1rem;
        }
        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
            background: #0f0f14;
            margin-bottom: 0.75rem;
        }
        .placeholder {
            width: 100%;
            height: 160px;
            border-radius: 8px;
            background: #0f0f14;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 0.85rem;
        }
        .card h3 {
            margin: 0 0 0.25rem 0;
            font-size: 1.1rem;
        }
        .card p {
            margin: 0 0 0.5rem 0;
            color: #9a9aa5;
            font-size: 0.85rem;
        }
        .price {
            color: #6c5ce7;
            font-weight: 600;
        }
        a.back {
            color: #6c5ce7;
            text-decoration: none;
        }
    </style>
</head>
<body>
    {% include 'store/nav.html' %}
    <a href="{% url 'dashboard' %}" class="back">&larr; Back to dashboard</a>
    <h1>Products</h1>
    <div class="grid">
        {% for product in products %}
            <a href="{% url 'product_detail' product.id %}" style="text-decoration: none; color: inherit;">
<div class="card">
                {% if product.image %}
                    <img src="{{ product.image.url }}" alt="{{ product.name }}">
                {% else %}
                    <div class="placeholder">No image</div>
                {% endif %}
                <h3>{{ product.name }}</h3>
                <p>{{ product.category }}</p>
                            <div class="price">${{ product.base_price }}</div>
            </div>
</a>
        {% empty %}
            <p>No products yet.</p>
        {% endfor %}
    </div>
</body>
</html>
