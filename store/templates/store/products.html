{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Products — 0vibe</title>
    <link rel="stylesheet" href="{% static 'store/main.css' %}">
<style>
    .content { padding: 3rem 3rem; }
    h1 {
        font-size: 2.2rem;
        margin-bottom: 2rem;
        font-family: Georgia, 'Times New Roman', serif;
        font-style: italic;
    }
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 1.75rem;
    }
    .card {
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        border: 1px solid var(--border);
    }
    .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }
    .card img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        border-radius: 8px;
        margin-bottom: 1rem;
    }
    .placeholder {
        width: 100%;
        height: 200px;
        border-radius: 8px;
        background: var(--bg);
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-muted);
        font-size: 0.85rem;
        border: 1px dashed var(--border);
    }
    .card h3 {
        margin: 0 0 0.35rem 0;
        font-size: 1.15rem;
    }
    .card .category {
        margin: 0 0 0.75rem 0;
        color: var(--text-muted);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }
    .price {
        color: var(--accent);
        font-weight: 700;
        font-size: 1.1rem;
    }
</style>
</head>
<body>
    {% include 'store/nav.html' %}
    <div class="content">
        <h1>Products</h1>
        <div class="grid">
            {% for product in products %}
                <a href="{% url 'product_detail' product.id %}" style="text-decoration: none; color: inherit;">
                <div class="card">
                    {% if product.image %}
                        <img src="{{ product.image.url }}" alt="{{ product.name }}">
                    {% else %}
                        <div class="placeholder">No image</div>
                    {% endif %}
                    <h3>{{ product.name }}</h3>
                    <p>{{ product.category }}</p>
                    <div class="price">${{ product.base_price }}</div>
                </div>
                </a>
            {% empty %}
                <p>No products yet.</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
