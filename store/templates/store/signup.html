<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up — 0vibe</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, Segoe UI, Roboto, sans-serif;
            background: #0f0f14;
            color: #f2f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .card {
            background: #1a1a22;
            padding: 2.5rem;
            border-radius: 12px;
            width: 320px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border-radius: 8px;
            border: 1px solid #33333d;
            background: #0f0f14;
            color: #f2f2f5;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            border-radius: 8px;
            border: none;
            background: #6c5ce7;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover {
            background: #5a4bd1;
        }
        p {
            text-align: center;
            color: #9a9aa5;
            font-size: 0.9rem;
        }
        a {
            color: #6c5ce7;
        }
        .error {
            color: #ff6b6b;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Create your account</h1>
        {% if messages %}
            {% for message in messages %}
                <div class="error">{{ message }}</div>
            {% endfor %}
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            <input type="email" name="email" placeholder="Email address" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Sign Up</button>
        </form>
        <p>Already have an account? <a href="{% url 'login' %}">Log in</a></p>
    </div>
</body>
</html>
